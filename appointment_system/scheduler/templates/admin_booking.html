<h2>All Appointments</h2>

<table border="1" cellpadding="10">
<tr>
<th>User</th>
<th>Doctor</th>
<th>Service</th>
<th>Date</th>
<th>Time Slot</th>
<th>Status</th>
<th>Action</th>
</tr>

{% for i in data %}
<tr>
<td>{{ i.user.name }}</td>
<td>{{ i.doctor.name }}</td>
<td>{{ i.service.service_name }}</td>
<td>{{ i.date }}</td>
<td>{{ i.timeslot.start_time }} - {{ i.timeslot.end_time }}</td>
<td>{{ i.status }}</td>
<td>
<a href="/approve/{{ i.id }}">Approve</a> |
<a href="/reject/{{ i.id }}">Reject</a>
</td>
</tr>
{% endfor %}

</table>
