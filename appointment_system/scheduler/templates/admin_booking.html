<h2>All Appointments</h2>

<table border="1" cellpadding="10">

<tr>
    <th>User</th>
    <th>Doctor</th>
    <th>Service</th>
    <th>Date</th>
    <th>Time Slot</th>
    <th>Status</th>
    <th>Action</th>
</tr>

{% for i in data %}

<tr>

    <td>{{ i.user.name }}</td>

    <td>{{ i.doctor.name }}</td>

    <td>{{ i.service.service_name }}</td>

    <td>{{ i.date }}</td>

    <td>{{ i.timeslot.start_time }} - {{ i.timeslot.end_time }}</td>

    <td>{{ i.status }}</td>

    <td>

        <!-- APPROVE -->
        <form method="POST" action="/approve/{{ i.id }}" style="display:inline;">
            {% csrf_token %}
            <button type="submit">Approve</button>
        </form>

        |

        <!-- REJECT -->
        <form method="POST" action="/reject/{{ i.id }}" style="display:inline;">
            {% csrf_token %}
            <button type="submit">Reject</button>
        </form>

    </td>

</tr>

{% endfor %}

</table>
